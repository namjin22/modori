<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self'" />
    <title>모도리</title>
    <style>
      :root { color-scheme: light dark; --bg: #f7f8fa; --fg: #191f28; --muted: #6b7684; --brand: #2563eb; }
      @media (prefers-color-scheme: dark) { :root { --bg: #111317; --fg: #e5e8eb; --muted: #9ea7b3; --brand: #60a5fa; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
        font-family: "Pretendard", system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { text-align: center; padding: 24px; max-width: 320px; }
      img { width: 72px; height: 72px; }
      h1 { font-size: 20px; margin: 16px 0 8px; }
      p { color: var(--muted); font-size: 14px; line-height: 1.6; margin: 0 0 20px; }
      button { height: 48px; padding: 0 24px; border: 0; border-radius: 16px; background: var(--brand); color: #fff;
        font-size: 15px; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="build/icon.png" alt="" />
      <h1>모도리에 연결하지 못했어요</h1>
      <p>인터넷 연결을 확인해 주세요. 연결되면 자동으로 다시 시도하고, F5를 눌러도 돼요.</p>
      <button id="retry" type="button">다시 시도</button>
    </main>
    <script>
      // 원래 가려던 모도리 주소로 돌아간다(main.js가 retry로 넘긴다).
      const retry = new URLSearchParams(location.search).get("retry");
      const go = () => {
        if (retry) location.href = retry;
      };
      document.getElementById("retry").addEventListener("click", go);
      // 잠깐 끊겼다 돌아온 경우를 위해 스스로도 다시 시도한다. 네트워크가 돌아오면 바로, 아니면 15초마다.
      window.addEventListener("online", go);
      setInterval(go, 15000);
    </script>
  </body>
</html>
