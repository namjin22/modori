# GSMSV VM의 /opt/modori에 두고 쓴다. 앱 이미지(modori:latest)는 deploy.sh가 넣는다.
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: modori
      POSTGRES_DB: modori
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?/opt/modori/.env에 POSTGRES_PASSWORD가 없다}
      TZ: Asia/Seoul
    volumes:
      # 18부터 데이터 폴더가 버전별 하위 폴더로 바뀌어 상위 폴더를 붙인다.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modori -d modori"]
      interval: 5s
      timeout: 3s
      retries: 20
    # 밖으로 열지 않는다. 앱과 백업만 이 네트워크 안에서 붙는다.

  app:
    image: ${IMAGE:-modori}:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://modori:${POSTGRES_PASSWORD}@db:5432/modori
      DIRECT_URL: postgresql://modori:${POSTGRES_PASSWORD}@db:5432/modori
      TZ: Asia/Seoul
    depends_on:
      db:
        condition: service_healthy
    # 앱이 응답하는지 Docker가 스스로 본다. `docker compose ps`에 (unhealthy)로 보인다. 이미지에 curl이 없어 node로 부른다.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # 백업이 멈췄는지 /api/health/backup이 파일 날짜만 본다. 읽기 전용이다.
    volumes:
      - ./backups:/backups:ro
    # cloudflared(VM에 직접 설치)만 붙는다. 바깥에서는 Cloudflare Tunnel로만 들어온다.
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"

volumes:
  pgdata:

# GSMSV VM의 네트워크 MTU가 1400이다. Docker 기본(1500)으로 두면 큰 패킷이 버려져
# 컨테이너에서 나가는 TLS 연결(Neon 백업, OAuth 토큰 교환)이 소리 없이 멈춘다.
networks:
  default:
    driver_opts:
      com.docker.network.driver.mtu: "1400"
