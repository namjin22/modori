name: health

# 운영 서버(GSMSV)가 죽어도 알려줄 곳이 없다. 15분마다 밖에서 확인하고,
# 실패하면 GitHub이 이 워크플로를 마지막으로 고친 사람에게 메일을 보낸다.
# /api/health는 DB까지 조회하므로 앱·DB·Cloudflare Tunnel 중 하나만 멈춰도 걸린다.
on:
  schedule:
    # 정각 무렵은 GitHub 예약 실행이 몰려 밀리거나 버려진다(문서에 나온 주의). 정각을 피한다.
    # "*/15"로 두었을 때 등록 뒤 두 시간 넘게 한 번도 돌지 않았다.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: modori.site 응답 확인
        run: |
          # 순간 끊김으로 메일이 오지 않게 세 번까지 다시 본다.
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -m 20 -w "%{http_code}" https://modori.site/api/health || true)
            if [ "$code" = "200" ]; then
              echo "정상 (${attempt}번째)"
              exit 0
            fi
            echo "응답 ${code} (${attempt}번째)"
            sleep 30
          done
          echo "::error::modori.site/api/health가 세 번 연속 200이 아니다"
          exit 1

      # 백업이 멈추면 서버는 멀쩡해도 데이터를 지킬 수 없다. 가장 최근 백업이 36시간을 넘으면 실패한다.
      - name: 백업이 최근 것인지 확인
        run: |
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -m 20 -w "%{http_code}" https://modori.site/api/health/backup || true)
            if [ "$code" = "200" ]; then
              echo "정상 (${attempt}번째)"
              exit 0
            fi
            echo "응답 ${code} (${attempt}번째)"
            sleep 30
          done
          echo "::error::백업이 36시간 넘게 새로 만들어지지 않았다(또는 백업 폴더를 읽지 못한다). VM에서 backup.sh 결과를 확인한다"
          exit 1

