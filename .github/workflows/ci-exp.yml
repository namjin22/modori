name: ci-exp

# 임시 실험용(병합하지 않는다). 3차: playwright --with-deps(apt)가 필요한가, 얼마나 들쭉날쭉한가.
on:
  pull_request:
    paths: [".github/workflows/ci-exp.yml"]

concurrency:
  group: ci-exp-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  apt:
    name: apt probe ${{ matrix.n }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 필요한 시스템 패키지 목록
        run: |
          npx playwright install-deps --dry-run chromium | tee deps.txt | cut -c1-300
      - name: apt-get update 시간
        run: |
          start=$SECONDS
          sudo apt-get update -qq
          echo "apt_update_seconds=$((SECONDS - start))"
      - name: 설치가 실제로 필요한 패키지가 있나(모의 설치)
        run: |
          PKGS=$(grep -oE 'apt-get install[^&]*' deps.txt | sed -E 's/apt-get install//; s/-y//; s/--no-install-recommends//' | head -1)
          echo "대상: $PKGS" | cut -c1-300
          sudo apt-get install --dry-run --no-install-recommends $PKGS | grep -E "newly installed|upgraded," || true
      - name: 브라우저만 받는다(시스템 패키지 없이)
        run: |
          start=$SECONDS
          npx playwright install chromium
          echo "browser_download_seconds=$((SECONDS - start))"
      - name: 시스템 패키지 없이 브라우저가 뜨나
        run: |
          node -e "
          const { chromium } = require('@playwright/test');
          (async () => {
            const b = await chromium.launch();
            const p = await b.newPage();
            await p.goto('about:blank');
            console.log('launch_ok version=' + b.version());
            await b.close();
          })().catch((e) => { console.error('launch_failed: ' + String(e.message).split('\n')[0]); process.exit(1); });
          "
      - name: 지금 방식(--with-deps) 시간
        run: |
          start=$SECONDS
          npx playwright install --with-deps chromium
          echo "with_deps_seconds=$((SECONDS - start))"
