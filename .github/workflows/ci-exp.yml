name: ci-exp

# 임시 실험용(병합하지 않는다). 같은 코드·같은 샤드에서 워커 수만 바꿔 E2E 시간과 불안정 정도를 잰다.
on:
  pull_request:
    paths: [".github/workflows/ci-exp.yml", "scripts/e2e-timing.mjs"]

concurrency:
  group: ci-exp-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: w${{ matrix.workers }} s${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        workers: [1, 2, 3]
        shard: [1, 2, 3, 4]

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: modori
          POSTGRES_PASSWORD: modori
          POSTGRES_DB: modori
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U modori -d modori"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://modori:modori@localhost:5432/modori
      DIRECT_URL: postgresql://modori:modori@localhost:5432/modori
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: echo "cpu=$(nproc) mem=$(free -m | awk '/Mem:/{print $2}')MB"
      - run: npm ci
      - run: npm ci --prefix desktop --include=dev
      - run: npm exec --prefix desktop -- install-electron
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y xvfb
      - run: npx prisma migrate deploy
      - name: E2E
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: result.json
        run: xvfb-run -a npx playwright test --shard=${{ matrix.shard }}/4 --workers=${{ matrix.workers }} --reporter=github,json
      - name: 시간 요약
        if: always()
        run: node scripts/e2e-timing.mjs result.json "w${{ matrix.workers }} s${{ matrix.shard }}/4"

  # npm ci(약 50초)를 node_modules 캐시로 바꾸면 얼마나 주는지 잰다. 첫 실행은 캐시를 만들고, 두 번째 실행부터 쓴다.
  install:
    name: install ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [npm-ci, node-modules-cache]
    env:
      DATABASE_URL: postgresql://modori:modori@localhost:5432/modori
      DIRECT_URL: postgresql://modori:modori@localhost:5432/modori
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: ${{ matrix.mode == 'npm-ci' && 'npm' || '' }}
      - name: node_modules 캐시
        id: nm
        if: matrix.mode == 'node-modules-cache'
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}
      - name: 설치
        if: matrix.mode == 'npm-ci' || steps.nm.outputs.cache-hit != 'true'
        run: npm ci
      - name: 캐시 상태
        run: |
          echo "hit=${{ steps.nm.outputs.cache-hit }}"
          du -sh node_modules
          node -e "require('@prisma/client'); console.log('prisma client ok')"
          npx tsc --version
