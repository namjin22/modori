name: testflight

# TestFlight에 올라간 iOS 빌드를 **외부** 테스트 그룹에 넣고 베타 앱 심사에 낸다(scripts/testflight-distribute.mjs).
# App Store Connect 화면 로그인은 친구 폰의 인증번호가 필요한데, iOS 빌드를 올릴 때 쓰는 API 열쇠(ASC_*)는 그것이 필요 없다.
# - mode=list: 읽기만 한다(빌드·그룹·상태 보기). 먼저 이것으로 본다.
# - mode=distribute: 심사를 내고 외부 그룹에 넣는다. 내부 그룹은 건드리지 않는다.
# build는 ios 워크플로의 실행 번호(= TestFlight 빌드 번호), version은 ios.yml의 MARKETING_VERSION이다.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "list는 읽기만, distribute는 심사를 내고 외부 그룹에 넣는다"
        type: choice
        options: [list, distribute]
        default: list
      build:
        description: "빌드 번호(ios 워크플로 실행 번호)"
        required: true
      version:
        description: "앱 버전(ios.yml의 MARKETING_VERSION)"
        default: "1.1.0"
  # 임시: 이 브랜치에서 읽기만 하는 list를 먼저 돌려 본다(병합 전에 이 줄을 뺀다).
  push:
    branches: [feat/testflight-distribute]

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: TestFlight 외부 그룹 작업
        env:
          # push로 돌 때는 입력이 없다. 읽기만 하는 list와 1.1.0(25)로 정한다.
          MODE: ${{ inputs.mode || 'list' }}
          BUILD: ${{ inputs.build || '25' }}
          VERSION: ${{ inputs.version || '1.1.0' }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: node scripts/testflight-distribute.mjs
