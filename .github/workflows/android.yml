name: android

# 모바일 앱(mobile/, Capacitor)의 Android 시험용 APK를 만든다. 손으로 돌리거나 mobile-v* 태그를 올리면 돈다.
# 결과 APK는 Actions 결과물(artifact)에서 받아 폰에 설치해 본다. 스토어에 올리는 서명된 AAB는 개발자 계정과 서명 키(비밀 값)가
# 정해진 뒤에 붙인다(docs/platforms.md). Android SDK와 Java는 ubuntu 러너에 이미 있어 Windows PC에 설치하지 않아도 된다.
on:
  push:
    tags: ["mobile-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # Capacitor 8의 Android 프로젝트는 Java 21이 필요하다.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      # 웹 화면은 서버(modori.site)에서 오므로 여기서는 앱 껍데기와 플러그인만 맞춘다.
      - run: npx cap sync android

      # Windows에서 커밋해 실행 권한이 없을 수 있다.
      - run: chmod +x android/gradlew

      - run: ./gradlew assembleDebug
        working-directory: mobile/android

      - uses: actions/upload-artifact@v4
        with:
          name: modori-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
