name: android

# 모바일 앱(mobile/, Capacitor)의 Android 시험용 APK를 만든다. 손으로 돌리거나 mobile-v* 태그를 올리면 돈다.
# 결과 APK는 Actions 결과물(artifact)에서 받아 폰에 설치해 본다. 스토어에 올리는 서명된 AAB는 release를 켜고 손으로 돌리거나
# mobile-v* 태그를 올리면 만든다(서명 키는 GitHub 비밀 4개, docs/mobile-release.md). Android SDK와 Java는 ubuntu 러너에 이미 있어
# Windows PC에 설치하지 않아도 된다.
on:
  push:
    tags: ["mobile-v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "스토어용 서명된 AAB도 만든다"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # Capacitor 8의 Android 프로젝트는 Java 21이 필요하다.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      # 웹 화면은 서버(modori.site)에서 오므로 여기서는 앱 껍데기와 플러그인만 맞춘다.
      - run: npx cap sync android

      # Windows에서 커밋해 실행 권한이 없을 수 있다.
      - run: chmod +x android/gradlew

      - run: ./gradlew assembleDebug
        working-directory: mobile/android

      - uses: actions/upload-artifact@v4
        with:
          name: modori-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  aab:
    # 태그를 올리거나 손으로 돌리면서 release를 켰을 때만.
    if: startsWith(github.ref, 'refs/tags/mobile-v') || inputs.release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npx cap sync android
      - run: chmod +x android/gradlew

      # 서명 키는 비밀로만 받는다. 없으면 서명 없이 조용히 넘어가지 않고 여기서 멈춘다.
      - name: 서명 키 준비
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::비밀 ANDROID_KEYSTORE_BASE64가 없어요. docs/mobile-release.md를 따라 넣어 주세요."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - run: ./gradlew bundleRelease
        working-directory: mobile/android
        env:
          MODORI_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          MODORI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MODORI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MODORI_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # 실행 번호는 계속 커지므로 스토어가 요구하는 "올릴 때마다 커지는 버전 코드"를 만족한다.
          MODORI_VERSION_CODE: ${{ github.run_number }}
          MODORI_VERSION_NAME: 1.0.${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: modori-android-release
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
