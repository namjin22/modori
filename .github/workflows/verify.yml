name: verify

on:
  push:
    branches: [main]
  pull_request:

# E2E가 테스트 DB 하나를 같이 쓰지만, 계정 이름에 실행마다 다른 꼬리표가 붙어(tests/e2e/run-tag.ts) 실행끼리 겹쳐도
# 서로의 계정을 지우지 않는다. 그래서 main 검증과 PR 검증을 다른 줄에 세운다.
#
# 한 줄로 세우면 GitHub가 기다리는 실행을 하나만 남기고 새 실행이 오면 앞의 대기를 취소한다. main에 합친 직후 PR을 열면
# 기다리던 main 검증이 취소되어, 검증에 묶인 운영 배포(deploy.yml)가 그 커밋에서 빠졌다(2026-09-29).
# - main: 한 줄로 세운다. 새 main 커밋이 오면 앞의 대기는 취소되지만 새 커밋이 앞 커밋을 포함하고 그 커밋이 배포된다.
# - PR: 브랜치마다 줄을 나눠 서로 취소하지 않고, 같은 PR의 새 커밋이 오면 앞의 실행만 취소한다.
concurrency:
  group: ${{ github.event_name == 'push' && 'verify-main' || format('verify-pr-{0}', github.head_ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # lock 파일 그대로 설치한다. 버전이 어긋나 배포가 깨진 적이 있다.
      - run: npm ci
      - run: npm ci --prefix desktop --include=dev
      # Electron 44는 npm ci만으로 바이너리를 내려받지 않는다. 명시적으로 설치한다.
      - run: npm exec --prefix desktop -- install-electron

      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y xvfb

      # Electron 설치 스크립트가 막히면 테스트가 건너뛰므로 먼저 명시적으로 실패시킨다.
      - run: test -s desktop/node_modules/electron/path.txt && test -x desktop/node_modules/electron/dist/electron

      - run: xvfb-run -a npm run verify
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
