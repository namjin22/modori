name: verify

on:
  push:
    branches: [main]
  pull_request:

# E2E가 실제 DB 하나를 같이 쓴다. 두 실행이 겹치면 서로의 테스트 계정을 지워서
# 아무 데나 실패한다. 줄 세워서 한 번에 하나만 돌린다.
concurrency:
  group: verify-shared-database
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # lock 파일 그대로 설치한다. 버전이 어긋나 배포가 깨진 적이 있다.
      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run verify
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
