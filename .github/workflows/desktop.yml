name: desktop

# 데스크톱 앱 설치 파일을 만들어 GitHub 릴리스에 붙인다. desktop/package.json의 version을 올리고
# 같은 번호로 태그(desktop-v1.0.1)를 올리면 돈다. 마이페이지의 "Windows 앱 받기"는 가장 최근 릴리스를 가리킨다.
#
# 릴리스 보호(이슈 #114):
# - 태그 번호와 desktop/package.json의 version이 다르면 아무것도 만들지 않는다.
# - Windows·macOS 둘 다 만들어진 뒤에야 릴리스를 만들고 올린다. 한쪽이 실패하면 반쪽 릴리스가 생기지 않는다.
# - 손으로 돌리면(workflow_dispatch) 설치 파일만 만들어 Actions 결과물로 남기고 릴리스는 건드리지 않는다.
# - 같은 태그를 다시 돌리면 그 태그의 파일을 교체한다(--clobber). 이미 공개한 버전의 내용을 바꾸려면 버전을 올린다.
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 태그와 앱 버전이 같은지 확인
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./desktop/package.json').version")
          if [ "$GITHUB_REF_NAME" != "desktop-v$version" ]; then
            echo "::error::태그 $GITHUB_REF_NAME와 desktop/package.json의 version $version이 다르다. 둘을 맞춘 뒤 다시 태그를 올린다."
            exit 1
          fi

  build:
    needs: version
    strategy:
      matrix:
        include:
          - os: windows-latest
            script: dist
            files: desktop/dist/Modori-Setup.exe
          - os: macos-latest
            script: dist:mac
            files: desktop/dist/Modori.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # Electron은 설치 스크립트로 실행 파일을 받는다. package.json의 allowScripts가 그것만 허용한다.
      - run: npm ci

      - run: npm run ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: dist
          merge-multiple: true

      - name: 릴리스에 붙이기
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "모도리 데스크톱 ${TAG#desktop-v}" --notes "모도리 데스크톱 앱"
          gh release upload "$TAG" dist/Modori-Setup.exe dist/Modori.dmg --repo "$GITHUB_REPOSITORY" --clobber
