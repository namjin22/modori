name: 앱 의존성 준비
description: Node와 node_modules를 준비한다. 캐시가 있으면 npm ci(약 50초)를 건너뛴다.

# 측정(2026-11-23): 같은 설치가 npm ci 45~74초, 캐시 복원 3초.
# 캐시 키는 락 파일 해시라서 의존성이 바뀌면 자연히 새로 만든다. 같은 키의 캐시는 PR 실행끼리, 그리고 main이 만든 것을 PR이 읽는다
# (main에서 캐시를 만드는 일은 verify.yml의 warm 작업이 한다).
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: node_modules 캐시
      id: modules
      uses: actions/cache@v4
      with:
        path: node_modules
        key: modules-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('package-lock.json') }}

    # lock 파일 그대로 설치한다. 버전이 어긋나 배포가 깨진 적이 있다.
    - name: 설치
      if: steps.modules.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci

    # 캐시된 node_modules에는 그때 만든 Prisma 클라이언트가 들어 있다. 락 파일은 그대로인데 스키마만 바뀐 경우에
    # 낡은 클라이언트를 쓰지 않도록, 캐시를 받았을 때는 클라이언트를 다시 만든다(npm ci는 postinstall로 이미 만든다).
    - name: Prisma 클라이언트 다시 만들기
      if: steps.modules.outputs.cache-hit == 'true'
      shell: bash
      run: npx prisma generate
