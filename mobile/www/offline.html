<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>모도리</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; background: #f7f8fa; color: #111827; }
    @media (prefers-color-scheme: dark) { body { background: #0f1115; color: #f3f4f6; } }
    main { max-width: 20rem; padding: 2rem; text-align: center; }
    h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
    p { margin: 0 0 1.5rem; color: #6b7280; line-height: 1.5; }
    button { height: 3rem; padding: 0 2rem; border: 0; border-radius: 1rem; background: #2563eb; color: #fff; font-size: 1rem; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>연결할 수 없어요</h1>
    <p>인터넷 연결을 확인하고 다시 시도해 주세요.</p>
    <button type="button" onclick="location.href = 'https://modori.site/'">다시 시도</button>
  </main>
</body>
</html>
